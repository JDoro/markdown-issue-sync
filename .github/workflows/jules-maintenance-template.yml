name: Jules Maintenance Template

# Caller workflow MUST check github.event.sender.login != 'google-labs-jules[bot]' before calling this, to prevent infinite loops.
on:
  workflow_call:
    inputs:
      focus_area:
        description: 'Area of focus for maintenance'
        required: false
        type: string
        default: 'the recent commits, checking for missing unit tests, and auditing npm dependencies'

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for Jules
        uses: actions/github-script@v7
        env:
          FOCUS_AREA: ${{ inputs.focus_area }}
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Weekly Maintenance',
              body: `Please review the following focus area: ${process.env.FOCUS_AREA}.\n\n@jules`,
              assignees: ['jules'],
              labels: ['jules', 'jules-task']
            })
