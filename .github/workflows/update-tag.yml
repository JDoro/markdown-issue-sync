name: Update Major Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    concurrency:
      group: update-tag-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Update v1 tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git_sha=$(git rev-parse HEAD)

          # Prevent stale runs from moving v1 backward
          remote_sha=$(gh api /repos/${{ github.repository }}/git/refs/heads/main --jq '.object.sha')
          if [ "$git_sha" != "$remote_sha" ]; then
            echo "Skipping update: checked out SHA $git_sha does not match latest main SHA $remote_sha"
          else
            # we use gh api to update the ref to avoid the tool restriction
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/git/refs/tags/v1 \
              -f sha="$git_sha" -F force=true
          fi
