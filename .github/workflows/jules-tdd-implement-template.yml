name: Jules TDD Implement Template

# Caller workflow MUST check github.event.sender.login != 'google-labs-jules[bot]' before calling this, to prevent infinite loops.
on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: string
      branch_name:
        description: 'Branch name'
        required: true
        type: string

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for Jules
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Implement Logic for PR #${process.env.PR_NUMBER}`,
              body: `Please checkout branch \`${process.env.BRANCH_NAME}\`, write the code to make the tests pass, and commit directly to that branch.\n\n@jules`,
              assignees: ['jules'],
              labels: ['jules', 'jules-task']
            })
