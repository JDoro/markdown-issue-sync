name: Jules TDD Generate Tests Template

# Caller workflow MUST check !contains(github.actor, 'jules') before calling this, to prevent infinite loops.
on:
  workflow_call:
    inputs:
      feature_title:
        description: 'Title of the feature'
        required: true
        type: string
      feature_desc:
        description: 'Description of the feature'
        required: true
        type: string

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue for Jules
        uses: actions/github-script@v7
        env:
          FEATURE_TITLE: ${{ inputs.feature_title }}
          FEATURE_DESC: ${{ inputs.feature_desc }}
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Write Tests: ${process.env.FEATURE_TITLE}`,
              body: `Please ONLY write failing unit tests based on the following feature description:\n\n${process.env.FEATURE_DESC}\n\nOpen a PR with just the tests.\n\n@jules`,
              assignees: ['jules'],
              labels: ['jules', 'jules-task']
            })
