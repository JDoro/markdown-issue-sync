name: Junie Auto-Fix Workflow

on:
  workflow_call:
    inputs:
      bot_username:
        description: 'Username of the bot that triggered the autofix'
        type: string
        default: 'kilocode-bot'
        required: false
    secrets:
      api_key:
        description: 'Junie API key'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  junie:
    runs-on: ubuntu-latest
    if: ${{ github.event.comment.user.login == inputs.bot_username }}
    steps:
      - name: Resolve PR branch
        id: pr
        if: ${{ github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
            --jq '"ref=" + .head.ref, "repo=" + .head.repo.full_name' >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo || github.repository }}
          ref: ${{ steps.pr.outputs.ref || '' }}

      - name: Run Junie Auto-Fix
        uses: JetBrains/junie-github-action@v1
        with:
          junie_api_key: ${{ secrets.api_key }}
          prompt: |
            Implement the following feedback provided by the automated reviewer:

            ${{ github.event.comment.body }}
