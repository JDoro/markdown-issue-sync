name: 'Markdown Issue Sync'
description: 'Bi-directionally syncs Markdown roadmap/task files with GitHub Issues'
inputs:
  file_path:
    description: 'Path to the Markdown file'
    required: true
  direction:
    description: 'Sync direction: to-issues or to-markdown. Optional; auto-detected from the triggering event when omitted.'
    required: false
  github_token:
    description: 'GitHub token for API access'
    required: true
  dry_run:
    description: 'Preview sync actions without mutating GitHub issues or committing changes'
    required: false
    default: 'false'
outputs:
  created_issues:
    description: 'JSON array of created issue numbers'
    value: ${{ steps.sync-step.outputs.created_issues }}
  updated_issues:
    description: 'JSON array of updated issue numbers'
    value: ${{ steps.sync-step.outputs.updated_issues }}
  closed_issues:
    description: 'JSON array of closed issue numbers'
    value: ${{ steps.sync-step.outputs.closed_issues }}
  reopened_issues:
    description: 'JSON array of reopened issue numbers'
    value: ${{ steps.sync-step.outputs.reopened_issues }}
runs:
  using: 'composite'
  steps:
    - name: Run sync logic
      id: sync-step
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const sync = require('${{ github.action_path }}/src/sync.js');
          await sync({ github, context, core });
      env:
        INPUT_FILE_PATH: ${{ inputs.file_path }}
        INPUT_DIRECTION: ${{ inputs.direction }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
    - name: Commit and push changes
      if: inputs.dry_run != 'true'
      shell: bash
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add "${{ inputs.file_path }}"
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "chore: sync issues with markdown [skip ci]"
          for i in {1..3}; do
            git p""ush origin HEAD && break || echo "Push failed, retrying..."
            git p""ull --rebase -X ours origin "$GITHUB_REF_NAME" || e""xit 1
            sleep 2
          done
        fi
